app-id: de.bund.ausweisapp.ausweisapp2
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: AusweisApp
rename-desktop-file: com.governikus.ausweisapp2.desktop
rename-icon: AusweisApp
copy-icon: true
finish-args:
  - --device=dri
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pcsc
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: pcsc-lite
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.2.tar.xz
        sha256: 60a08942d8c00a1d86a3bf4c64eddbf7a5569c7c54f6904e3f07801bb5316acd
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dsystemdunit=system
      - -Dpolkit=false
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig

  - name: llhttp
    sources:
      - type: archive
        url: https://github.com/nodejs/llhttp/archive/refs/tags/release/v9.4.3.tar.gz
        sha256: 1eb813c7437b31a87496a1cd3ed79f00746720f5e7e29c79b42c02cb69f36c39
        x-checker-data:
          type: anitya
          project-id: 241543
          url-template: https://github.com/nodejs/llhttp/archive/refs/tags/release/v$version.tar.gz
    buildsystem: cmake-ninja
    config-opts:
      - -DLLHTTP_BUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  - name: AusweisApp
    sources:
      - type: archive
        url: https://github.com/Governikus/AusweisApp/releases/download/2.6.0/AusweisApp-2.6.0.tar.gz
        sha256: a82f2094621a4ab53db04adf63ac67c3109802963b8eff8a87f3bbb356f365ea
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Governikus/AusweisApp/releases/latest
          tag-query: .tag_name
          version-query: $tag
          url-query: .assets[] | select(.name=="AusweisApp-" + $version + ".tar.gz")
            | .browser_download_url
          is-main-source: true
          timestamp-query: .published_at

      - type: patch
        path: version.patch

      - type: file
        path: de.bund.ausweisapp.ausweisapp2.appdata.xml
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DVENDOR=flathub
      - -DVENDOR_DOMAIN=flathub.org
    builddir: true
    post-install:
      - install -D ../de.bund.ausweisapp.ausweisapp2.appdata.xml /app/share/appdata/de.bund.ausweisapp.ausweisapp2.appdata.xml
