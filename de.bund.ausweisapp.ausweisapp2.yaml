app-id: de.bund.ausweisapp.ausweisapp2
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: AusweisApp
rename-desktop-file: com.governikus.ausweisapp2.desktop
rename-icon: AusweisApp
copy-icon: true
finish-args:
  - --device=dri
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pcsc
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: pcsc-lite
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.4.tar.xz
        sha256: 23b1c644ab4f13269d3a9ff26734f473f622deff6ed60492171a9a25f603f078
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dsystemdunit=system
      - -Dpolkit=false
    cleanup:
      - /include
      - /lib/*.la
      - /lib/pkgconfig

  - name: llhttp
    sources:
      - type: archive
        url: https://github.com/nodejs/llhttp/archive/refs/tags/release/v9.4.4.tar.gz
        sha256: 5600adb1498f82a9c719b8eb19310021737388e0d92362a6d47be532710d3c96
        x-checker-data:
          type: anitya
          project-id: 241543
          url-template: https://github.com/nodejs/llhttp/archive/refs/tags/release/v$version.tar.gz
    buildsystem: cmake-ninja
    config-opts:
      - -DLLHTTP_BUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake

  - name: AusweisApp
    sources:
      - type: archive
        url: 
          https://github.com/Governikus/AusweisApp/releases/download/2.6.3/AusweisApp-2.6.3.tar.gz
        sha256: 87a9a0546ee82aac2d21efa62eb5d42dd1538e93bf748d7ae230f590d528bde8
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Governikus/AusweisApp/releases/latest
          tag-query: .tag_name
          version-query: $tag
          url-query: .assets[] | select(.name=="AusweisApp-" + $version + ".tar.gz")
            | .browser_download_url
          is-main-source: true
          timestamp-query: .published_at

      - type: patch
        path: vendor.patch

      - type: file
        path: de.bund.ausweisapp.ausweisapp2.appdata.xml
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=MinSizeRel
      - -DVENDOR=flathub
      - -DVENDOR_DOMAIN=flathub.org
    builddir: true
    post-install:
      - install -D ../de.bund.ausweisapp.ausweisapp2.appdata.xml /app/share/appdata/de.bund.ausweisapp.ausweisapp2.appdata.xml
